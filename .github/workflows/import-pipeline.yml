name: Import Hualien pipeline code

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-pipeline.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination
        uses: actions/checkout@v4
        with:
          path: destination

      - name: Check out pinned source
        uses: actions/checkout@v4
        with:
          repository: hakusan0118/taiwan-local-procurement
          ref: 1ecea6cf5acd6133cabcb49874114b48010ddf43
          path: source

      - name: Copy code without data or Taichung workflows
        shell: bash
        run: |
          set -euo pipefail
          cp -a source/scripts destination/
          cp -a source/tests destination/
          mkdir -p destination/config
          cp source/config/hualien.json destination/config/
          cp source/config/project_families_hualien.json destination/config/
          cp source/requirements-excel.txt destination/
          cp source/.gitignore destination/
          printf '%s\n' 'source_repository=hakusan0118/taiwan-local-procurement' > destination/PIPELINE_SOURCE.txt
          printf '%s\n' 'source_commit=1ecea6cf5acd6133cabcb49874114b48010ddf43' >> destination/PIPELINE_SOURCE.txt
          test ! -e destination/data
          test ! -e destination/.github/workflows/fetch-taichung.yml

      - name: Run imported tests
        shell: bash
        working-directory: destination
        run: python -m unittest discover -s tests -v

      - name: Commit imported pipeline
        shell: bash
        working-directory: destination
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts tests config requirements-excel.txt .gitignore PIPELINE_SOURCE.txt
          if git diff --cached --quiet; then
            echo "No pipeline changes to commit."
            exit 0
          fi
          git commit -m "Import Hualien collection pipeline"
          git push
