name: 花蓮範圍一週探索

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 探索開始日期（YYYY-MM-DD）
        required: true
        default: "2025-01-06"
        type: string
      end_date:
        description: 探索結束日期（YYYY-MM-DD，最多31天）
        required: true
        default: "2025-01-12"
        type: string

permissions:
  contents: read

concurrency:
  group: hualien-scope-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out public pipeline
        uses: actions/checkout@v4

      - name: Check out private data repository
        uses: actions/checkout@v4
        with:
          repository: hakusan0118/hualien-public-spending-data
          token: ${{ secrets.HUALIEN_DATA_REPO_TOKEN }}
          path: private-data

      - name: Scan nationwide award indexes
        shell: bash
        run: |
          set -euo pipefail
          output="private-data/data/discovery/${{ inputs.start_date }}_${{ inputs.end_date }}.json"
          python scripts/discover_hualien_scope.py \
            --start-date "${{ inputs.start_date }}" \
            --end-date "${{ inputs.end_date }}" \
            --output "$output"

      - name: Commit candidates to private repository
        shell: bash
        working-directory: private-data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery
          if git diff --cached --quiet; then
            echo "No discovery changes to commit."
            exit 0
          fi
          git commit -m "data: add Hualien scope discovery ${{ inputs.start_date }} to ${{ inputs.end_date }}"
          git push
