name: 花蓮範圍年度探索

on:
  workflow_dispatch:
    inputs:
      year:
        description: 探索年度（2010–2026；當年度只抓到今天）
        required: true
        default: "2010"
        type: string

permissions:
  contents: read

# 各年度仍依序執行，避免同時大量請求公開 API，也避免私人 repo push 衝突。
concurrency:
  group: hualien-scope-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out public pipeline
        uses: actions/checkout@v4

      - name: Check out private data repository
        uses: actions/checkout@v4
        with:
          repository: hakusan0118/hualien-public-spending-data
          token: ${{ secrets.HUALIEN_DATA_REPO_TOKEN }}
          path: private-data

      - name: Validate requested year
        shell: bash
        run: |
          set -euo pipefail
          year="${{ inputs.year }}"
          current_year="$(date -u +%Y)"
          if ! [[ "$year" =~ ^[0-9]{4}$ ]] || (( year < 2010 || year > 2026 )); then
            echo "::error::年度必須介於 2010 與 2026"
            exit 1
          fi
          if (( year > current_year )); then
            echo "::error::不可探索尚未開始的年度 $year"
            exit 1
          fi

      - name: Scan nationwide award indexes month by month
        shell: bash
        run: |
          set -euo pipefail
          year="${{ inputs.year }}"
          today="$(date -u +%F)"

          for month in $(seq -w 1 12); do
            start_date="${year}-${month}-01"
            end_date="$(date -u -d "$start_date +1 month -1 day" +%F)"

            if [[ "$start_date" > "$today" ]]; then
              break
            fi
            if [[ "$end_date" > "$today" ]]; then
              end_date="$today"
            fi

            output="private-data/data/discovery/${year}/${start_date}_${end_date}.json"
            python scripts/discover_hualien_scope.py \
              --start-date "$start_date" \
              --end-date "$end_date" \
              --output "$output"
          done

      - name: Commit candidates to private repository
        shell: bash
        working-directory: private-data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery
          if git diff --cached --quiet; then
            echo "No discovery changes to commit."
            exit 0
          fi
          git commit -m "data: add Hualien scope discovery ${{ inputs.year }}"
          git push
